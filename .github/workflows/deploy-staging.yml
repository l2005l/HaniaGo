name: Deploy HaniaGo staging

# Staging: its own Worker (haniago-staging) and database, never the live app.
on:
  workflow_dispatch:
  push:
    branches: [feature/hania-today, feature/price-alerts]

concurrency:
  group: haniago-staging
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GO_URL: https://haniago-staging.lior-hania.workers.dev
      PASS_URL: https://hania-pass-staging.lior-hania.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/*.test.mjs
      - run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npm install --no-audit --no-fund
      - name: Find or create the staging database
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="haniago-staging") | .uuid')
          if [ -z "$id" ]; then npx wrangler d1 create haniago-staging; id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="haniago-staging") | .uuid'); fi
          test -n "$id"
          sed -i "s/STAGING_DB_ID_FROM_DEPLOY/$id/" wrangler.jsonc
      - run: npx wrangler d1 migrations apply haniago-staging --remote --env staging
      - run: npx wrangler deploy --env staging
      - name: Smoke test, with and without a Hania360 account
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do curl -fsS "$GO_URL/api/health" && break; sleep 5; done; echo
          DEV=$(cat /proc/sys/kernel/random/uuid)
          curl -fsS -X PUT -H "x-device: $DEV" -H 'content-type: application/json' "$GO_URL/api/trip" -d "{\"dest\":\"rome\",\"date\":\"$(date -u -d '+20 days' +%F)\",\"nights\":5,\"fam\":[{\"a\":40},{\"a\":9}]}" > /dev/null
          curl -fsS -H "x-device: $DEV" "$GO_URL/api/account" | grep -q '"signedIn":false'
          curl -fsS -X POST -H 'content-type: application/json' -H "Origin: $PASS_URL" "$PASS_URL/api/auth/link" -d '{"email":"go-smoke@example.com"}' > /tmp/link.json
          LINK=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/link.json","utf8")).developmentLink')
          curl -sS -D /tmp/h.txt -o /dev/null "$LINK"
          C="Cookie: hp_session=$(grep -i '^set-cookie: hp_session=' /tmp/h.txt | sed -E 's/.*hp_session=([^;]*).*/\1/' | tr -d '\r')"
          curl -fsS -X POST -H 'content-type: application/json' -H "Origin: $GO_URL" -H "x-device: $DEV" -H "$C" "$GO_URL/api/account/link" -d '{}' | grep -q '"linked":true'
          curl -fsS -H "Origin: $PASS_URL" -H "$C" "$GO_URL/api/account/summary" | tee /tmp/s.json; echo
          grep -q '"dest":"רומא"' /tmp/s.json
          curl -fsS -X POST -H 'content-type: application/json' -H "Origin: $GO_URL" -H "x-device: $DEV" -H "$C" "$GO_URL/api/account/unlink" -d '{}' | grep -q '"linked":false'
          echo "HaniaGo staging: the trip saves to the account and Hania Today can read it."
          # Price alerts: the first is free; a second costs 50 Hania points, which a new account does not have yet.
          D1=$(date -u -d '+40 days' +%F); D2=$(date -u -d '+45 days' +%F)
          curl -fsS -X POST -H 'content-type: application/json' -H "Origin: $GO_URL" -H "x-device: $DEV" "$GO_URL/api/alerts" -d "{\"code\":\"FCO\",\"name\":\"רומא\",\"date\":\"$D1\",\"target\":900}" | tee /tmp/a1.json; echo
          grep -q '"paid":0' /tmp/a1.json
          code=$(curl -sS -o /tmp/a2.json -w '%{http_code}' -X POST -H 'content-type: application/json' -H "Origin: $GO_URL" -H "x-device: $DEV" -H "$C" "$GO_URL/api/alerts" -d "{\"code\":\"FCO\",\"name\":\"רומא\",\"date\":\"$D2\",\"target\":900}")
          cat /tmp/a2.json; echo; test "$code" = 402; grep -q '"not_enough"' /tmp/a2.json
          curl -fsS -H "x-device: $DEV" -H "$C" "$GO_URL/api/alerts" > /dev/null
          curl -fsS -H "Origin: $PASS_URL" -H "$C" "$GO_URL/api/account/summary" | grep -q '"alerts":\[{"name":"רומא"'
          ID=$(node -pe 'JSON.parse(require("fs").readFileSync("/tmp/a1.json","utf8")).alert.id')
          curl -fsS -X POST -H 'content-type: application/json' -H "Origin: $GO_URL" -H "x-device: $DEV" "$GO_URL/api/alerts/delete" -d "{\"id\":\"$ID\"}" > /dev/null
          echo "HaniaGo staging: price alerts save, the second asks Hania Pass for points, and Hania Today can read them."
